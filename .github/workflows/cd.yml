# Disparo automatico en push a main deshabilitado a proposito: Vercel ya
# despliega backend y frontend con su integracion nativa (GitHub App), que
# no necesita ningun secret de este repo. Este pipeline requeriria cargar
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID_BACKEND/FRONTEND,
# DATABASE_URL, DIRECT_URL y VITE_API_URL para funcionar, y correr en
# paralelo al deploy nativo generaria dos mecanismos de deploy compitiendo.
# Se deja disponible solo por workflow_dispatch (manual) para no perder el
# trabajo si en algun momento se decide migrar del deploy nativo a este.
name: CD Pipeline

on:
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy Backend (Vercel)
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: ./espacios-publicos-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # necesario para poder diffear contra el commit anterior

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: espacios-publicos-backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build backend
        run: npm run build

      - name: Detect Prisma schema changes
        id: schema-changed
        run: |
          run_migrations=true
          base_sha="${{ github.event.before }}"

          if [ -n "$base_sha" ] && [ "$base_sha" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            if git diff --quiet "$base_sha" "${{ github.sha }}" -- prisma; then
              run_migrations=false
            fi
          fi
          # Si no se puede determinar el commit anterior (workflow_dispatch, primer
          # push, historial no disponible), se asume que hay cambios: prisma migrate
          # deploy es idempotente y no hace nada si no hay migraciones pendientes.

          echo "changed=$run_migrations" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        if: steps.schema-changed.outputs.changed == 'true'
        run: npm run prisma:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Deploy to Vercel
        run: npx --yes vercel deploy --prod --token="$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BACKEND }}

      - name: Deployment success notification
        if: success()
        run: echo "Backend deployed successfully!"

  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: ./espacios-publicos-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: espacios-publicos-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Vercel
        run: npx --yes vercel deploy --prod --token="$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}

      - name: Deployment success notification
        if: success()
        run: echo "✅ Frontend deployed successfully!"

  post-deployment:
    name: Post Deployment Checks
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    steps:
      - name: Check deployment status
        run: |
          echo "Backend deployment: ${{ needs.deploy-backend.result }}"
          echo "Frontend deployment: ${{ needs.deploy-frontend.result }}"

          if [ "${{ needs.deploy-backend.result }}" == "success" ] && \
             [ "${{ needs.deploy-frontend.result }}" == "success" ]; then
            echo "✅ Deployment completed successfully!"
          else
            echo "⚠️ Some deployments may have failed or been skipped"
            exit 1
          fi

      # Health check de la API real en produccion (requiere la variable de
      # repositorio/entorno API_URL, no un secret, ya que no es sensible).
      - name: Health check API
        if: vars.API_URL != ''
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          case "$API_URL" in
            https://*) ;;
            *) echo "API_URL must use HTTPS"; exit 1 ;;
          esac
          curl --proto '=https' --fail --show-error --silent -- "$API_URL/health"

# -----------------------------------------------------------------------------
# GitHub Secrets a configurar (Settings > Environments > "production" de este
# repo) para que este workflow pueda desplegar:
#
#   VERCEL_TOKEN                Token de acceso de Vercel (cuenta u organizacion)
#                                con permisos de deploy sobre ambos proyectos.
#   VERCEL_ORG_ID                ID de la organizacion/equipo de Vercel (comun a
#                                ambos proyectos).
#   VERCEL_PROJECT_ID_BACKEND    ID del proyecto Vercel de espacios-publicos-backend.
#   VERCEL_PROJECT_ID_FRONTEND   ID del proyecto Vercel de espacios-publicos-frontend.
#   DATABASE_URL                 Connection string (pooled) de la base de datos
#                                de produccion, usada por Prisma para las
#                                migraciones y por los tests del backend.
#   DIRECT_URL                   Connection string directa (sin pooling) de la
#                                base de produccion, requerida por Prisma para
#                                `migrate deploy`.
#   VITE_API_URL                 URL publica del backend en produccion, horneada
#                                en el build del frontend.
#
# GitHub Variables (Settings > Environments > "production", no son secretas):
#   API_URL                      URL publica del backend en produccion (ej.
#                                https://api.midominio.com), usada solo para el
#                                health check post-deploy. Si no se define, el
#                                health check se omite.
# -----------------------------------------------------------------------------
