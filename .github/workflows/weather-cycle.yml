name: Weather alert cycle

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run-weather-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke protected weather cycle
        env:
          WEATHER_CYCLE_URL: ${{ secrets.WEATHER_CYCLE_URL }}
          WEATHER_CRON_SECRET: ${{ secrets.WEATHER_CRON_SECRET }}
        run: |
          if [ -z "${WEATHER_CYCLE_URL}" ] || [ -z "${WEATHER_CRON_SECRET}" ]; then
            echo "Weather cycle skipped: configure WEATHER_CYCLE_URL and WEATHER_CRON_SECRET."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            -H "Authorization: Bearer ${WEATHER_CRON_SECRET}" \
            "${WEATHER_CYCLE_URL}"
