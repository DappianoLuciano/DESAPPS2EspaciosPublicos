name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./espacios-publicos-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: espacios-publicos-backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run tests
        run: npm test
        env:
          # Variables de entorno necesarias para tests
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/test' }}

      - name: Build backend
        run: npm run build

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-build
          path: espacios-publicos-backend/dist/
          retention-days: 7

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./espacios-publicos-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: espacios-publicos-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run linter
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.example.invalid

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build
          path: espacios-publicos-frontend/dist/
          retention-days: 7

  integration:
    name: Integration Check
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Download backend artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-build
          path: ./backend-build

      - name: Download frontend artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-build
          path: ./frontend-build

      - name: Verify builds
        run: |
          echo "✅ Backend build successful"
          ls -la ./backend-build
          echo "✅ Frontend build successful"
          ls -la ./frontend-build
          echo "✅ Integration check passed"

  status-check:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend, frontend, integration]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.backend.result }}" == "success" ] && \
             [ "${{ needs.frontend.result }}" == "success" ] && \
             [ "${{ needs.integration.result }}" == "success" ]; then
            echo "✅ All CI checks passed successfully!"
            exit 0
          else
            echo "❌ CI checks failed:"
            echo "Backend: ${{ needs.backend.result }}"
            echo "Frontend: ${{ needs.frontend.result }}"
            echo "Integration: ${{ needs.integration.result }}"
            exit 1
          fi
