server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router usa BrowserRouter (ver src/App.tsx): cualquier ruta que no
    # matchee un archivo estatico real tiene que devolver index.html para que
    # el router del lado del cliente resuelva la URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
