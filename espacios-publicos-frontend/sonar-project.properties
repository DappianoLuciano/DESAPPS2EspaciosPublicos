# SonarQube Configuration - Frontend
# ====================================

# Identificación del proyecto
sonar.projectKey=DappianoLuciano_DESAPPS2EspaciosPublicos
sonar.organization=dappianoluciano
sonar.projectName=CityPass Espacios Públicos - Frontend
sonar.projectVersion=1.0

# Estructura del proyecto
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Exclusiones
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.config.ts,**/*.config.js
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

# Lenguajes
sonar.language=ts

# React específico
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Quality Gate
# sonar.qualitygate.wait=true

# Configuración adicional
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
