# SonarQube Configuration - Backend
# ===================================

# Identificación del proyecto
sonar.projectKey=DappianoLuciano_DESAPPS2EspaciosPublicos
sonar.organization=dappianoluciano
sonar.projectName=CityPass Espacios Públicos - Backend
sonar.projectVersion=1.0

# Estructura del proyecto
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Exclusiones
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/prisma/**
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/prisma/**

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# Code Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Lenguajes
sonar.language=ts

# Quality Gate - Umbrales personalizados (ajustar según necesidad)
# sonar.qualitygate.wait=true

# Configuración adicional para análisis más profundo
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts
